<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Exported - ComicCraft</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f7f9fa;
    padding: 24px;
  }
  .success-card {
    text-align: center;
    background: white;
    padding: 40px 48px;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
    max-width: 480px;
  }
  h1 {
    color: #2e7d32;
    font-size: 1.6rem;
    margin-top: 0;
  }
  p {
    color: #444;
    margin: 16px 0 28px 0;
    line-height: 1.5;
  }
  a.button {
    background: #1565c0;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  a.button:hover { background: #0d47a1; }
</style>
</head>
<body>
  <div class="success-card">
    <h1>✅ Comic Exported Successfully!</h1>
    <p>Your AI-powered comic has been successfully created! Dive back in and bring another story to life.</p>
    <a class="button" href="/">🎨 Go Create Another Comic</a>
  </div>
</body>
</html>
